<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>一起听房 · 可交互原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f1ec;
    padding: 48px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .page-title { font-size: 22px; font-weight: 600; color: #1a1a1a; }
  .page-sub {
    font-size: 14px; color: #8a8a86; margin-top: 6px; margin-bottom: 28px;
    text-align: center; max-width: 480px;
  }

  .phone {
    width: 320px; height: 690px;
    border-radius: 44px;
    background: #0e0e10;
    padding: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.18);
  }
  .screen {
    width: 100%; height: 100%;
    border-radius: 34px;
    overflow: hidden;
    position: relative;
  }
  .layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    transition: transform 0.32s ease;
  }

  /* player layer */
  #playerLayer {
    background: linear-gradient(180deg, #eef0f2 0%, #eef0f2 55%, #f3dcb8 100%);
  }
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px 4px; font-size: 13px; font-weight: 600; color: #1a1a1a;
  }
  .nav { display: flex; justify-content: space-between; align-items: center; padding: 6px 18px 0; font-size: 18px; color: #333; }
  .disc-wrap { display: flex; justify-content: center; margin-top: 16px; }
  .disc {
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d8d8d8, #a9a9a9 60%, #8c8c8c 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
  }
  .disc-photo { width: 92px; height: 92px; background: #ece7dc; border: 5px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,0.25); transform: rotate(-6deg); }

  .roomrow {
    margin: 16px 18px 0;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 22px;
    padding: 7px 10px 7px 12px;
    display: flex; align-items: center; gap: 8px;
    cursor: pointer;
  }
  .roomrow:active { background: rgba(255,255,255,0.8); }
  .lv-tag { background: #1a1a1a; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  .roomrow-text { font-size: 12px; color: #55524c; flex: 1; }
  .avatars { display: flex; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #f3ede0; margin-left: -8px; display:flex; align-items:center; justify-content:center; font-size: 12px; flex-shrink:0; }
  .avatar:first-child { margin-left: 0; }
  .a1 { background: #b9c9e8; } .a2 { background: #cfe3b0; } .a3 { background: #ddb9d6; }

  .track-info { padding: 14px 20px 0; }
  .track-title { font-size: 20px; font-weight: 700; color: #1a1a1a; }
  .track-artist { font-size: 13px; color: #6d6a63; margin-top: 4px; }

  .icon-row { display: flex; justify-content: space-between; padding: 20px 22px 0; color: #555; font-size: 17px; }
  .icon-item { display: flex; align-items: center; gap: 3px; }
  .icon-item i { font-style: normal; font-size: 12px; color: #666; }

  .float-zone { height: 26px; margin: 8px 18px 0; position: relative; overflow: hidden; }
  .float-bubble {
    position: absolute; top: 0; right: 0;
    background: rgba(255,255,255,0.92);
    border: 1px solid #e2ddd0;
    font-size: 12px; color: #444;
    padding: 4px 10px; border-radius: 14px;
    white-space: nowrap;
    transition: transform 3s linear, opacity 3s linear;
    opacity: 1;
  }

  .input-bar { margin: 4px 18px 0; display: flex; align-items: center; gap: 8px; }
  .input-field {
    flex: 1; background: rgba(255,255,255,0.65);
    border: 1px solid rgba(0,0,0,0.08); border-radius: 18px;
    padding: 8px 14px; font-size: 13px; color: #333; outline: none;
    font-family: inherit;
  }
  .input-field::placeholder { color: #999; }
  .send-btn {
    width: 34px; height: 34px; background: #1a1a1a; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px; border: none; cursor: pointer; flex-shrink:0;
  }
  .send-btn:active { background: #333; }

  .progress { margin: 12px 22px 0; }
  .bar { height: 2px; background: #cfcac0; border-radius: 2px; position: relative; }
  .bar::after { content: ""; position: absolute; left: 40%; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #1a1a1a; }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: #8a8680; margin-top: 6px; }

  .transport { display: flex; justify-content: space-between; align-items: center; padding: 14px 26px 0; font-size: 22px; color: #222; }
  .play-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #222; display: flex; align-items: center; justify-content: center; font-size: 17px; }

  /* room layer */
  #roomLayer {
    background: #fbfaf6;
    transform: translateX(100%);
  }
  .room-header { display: flex; align-items: center; gap: 10px; padding: 16px 18px 14px; }
  .back-arrow { font-size: 20px; color: #333; width: 24px; cursor: pointer; background: none; border: none; }
  .room-title { font-size: 15px; font-weight: 700; color: #1a1a1a; flex: 1; }
  .room-sub { font-size: 12px; color: #8a8680; }

  .member-strip { display: flex; gap: 14px; padding: 0 18px 14px; border-bottom: 1px solid rgba(0,0,0,0.06); }
  .member { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .member .avatar { margin-left: 0; width: 38px; height: 38px; }
  .member-name { font-size: 10px; color: #6d6a63; }

  .chat-feed { flex: 1; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .msg { display: flex; gap: 8px; align-items: flex-start; }
  .msg .avatar { width: 28px; height: 28px; margin-left: 0; flex-shrink:0; }
  .msg-body { flex: 1; }
  .msg-name { font-size: 11px; color: #8a8680; }
  .msg-text { font-size: 13px; color: #2a2a2a; margin-top: 3px; line-height: 1.4; }

  .hint {
    font-size: 11px; color: #b7b2a4; text-align: center; margin-top: 22px;
  }
</style>
</head>
<body>

  <div class="page-title">一起听房 · 可交互原型</div>
  <div class="page-sub">点头像组进房间;播放页发弹幕会飘屏 + 自动写入房间聊天记录;房间内也能单独聊天。</div>

  <div class="phone">
    <div class="screen">

      <div class="layer" id="playerLayer">
        <div class="statusbar"><span>04:34</span><span>••• 📶 🔋</span></div>
        <div class="nav"><span>⌄</span><span>⇄  ⏻</span></div>

        <div class="disc-wrap"><div class="disc"><div class="disc-photo"></div></div></div>

        <div class="roomrow" id="openRoom">
          <span class="lv-tag">LV1</span>
          <span class="roomrow-text">相距1公里,一起听了221分钟</span>
          <div class="avatars">
            <div class="avatar a1">🐱</div>
            <div class="avatar a2">🌱</div>
            <div class="avatar a3">🐰</div>
          </div>
          <span style="font-size:13px;color:#999">›</span>
        </div>

        <div class="track-info">
          <div class="track-title">褪色梦</div>
          <div class="track-artist">无尾兔 · 关注 · 3人在听</div>
        </div>

        <div class="icon-row">
          <span class="icon-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.6"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z"/><path d="M19 11a7 7 0 01-14 0M12 18v3"/></svg><i>2</i></span>
          <span class="icon-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.6"><path d="M3 10v4h4l5 4V6L7 10H3z"/><path d="M17 9l4 6M21 9l-4 6"/></svg><i>off</i></span>
          <span class="icon-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="#555" stroke="none"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.5 3.4 6-.2 1-.7 2.2-1.6 3.3 1.6-.2 3-.8 4.1-1.6 1.2.4 2.6.7 4.1.7 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg></span>
          <span class="icon-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.6"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.5 3.4 6-.2 1-.7 2.2-1.6 3.3 1.6-.2 3-.8 4.1-1.6 1.2.4 2.6.7 4.1.7 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg><i>63</i></span>
          <span class="icon-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="#555" stroke="none"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>
        </div>

        <div class="float-zone" id="floatZone"></div>

        <div class="input-bar">
          <input class="input-field" id="danmuInput" placeholder="发一条弹幕" maxlength="30" />
          <button class="send-btn" id="sendDanmu">➤</button>
        </div>

        <div class="progress">
          <div class="bar"></div>
          <div class="times"><span>01:20</span><span>02:33</span></div>
        </div>

        <div class="transport">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.6"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#222" stroke="none"><path d="M11 12L20 5v14l-9-7z"/><path d="M4 5h2v14H4z"/></svg>
          <div class="play-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#222" stroke="none"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#222" stroke="none"><path d="M13 12L4 5v14l9-7z"/><path d="M18 5h2v14h-2z"/></svg>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </div>
      </div>

      <div class="layer" id="roomLayer">
        <div class="room-header">
          <button class="back-arrow" id="backBtn">←</button>
          <span class="room-title">一起听房</span>
          <span class="room-sub">221分钟</span>
        </div>

        <div class="member-strip">
          <div class="member"><div class="avatar a1">🐱</div><span class="member-name">小林橙汁</span></div>
          <div class="member"><div class="avatar a2">🌱</div><span class="member-name">我</span></div>
          <div class="member"><div class="avatar a3">🐰</div><span class="member-name">小林秋</span></div>
        </div>

        <div class="chat-feed" id="chatFeed"></div>

        <div class="input-bar" style="margin-bottom:18px">
          <input class="input-field" id="roomInput" placeholder="在房间里说点什么" maxlength="60" />
          <button class="send-btn" id="sendRoom">➤</button>
        </div>
      </div>

    </div>
  </div>

  <div class="hint">这是一个真实可点击的原型 · 尝试在两个输入框各发一条试试</div>

<script>
  const chat = [
    { av: 'a1', emoji: '🐱', name: '小林橙汁', text: '这段前奏绝了', danmu: true },
    { av: 'a3', emoji: '🐰', name: '小林秋', text: '晚安,今天听得好舒服', danmu: false }
  ];

  const chatFeed = document.getElementById('chatFeed');
  function renderChat() {
    chatFeed.innerHTML = '';
    chat.forEach(m => {
      const row = document.createElement('div');
      row.className = 'msg';
      row.innerHTML =
        '<div class="avatar ' + m.av + '">' + m.emoji + '</div>' +
        '<div class="msg-body">' +
          '<div class="msg-name">' + m.name + '</div>' +
          '<div class="msg-text">' + m.text + '</div>' +
        '</div>';
      chatFeed.appendChild(row);
    });
    chatFeed.scrollTop = chatFeed.scrollHeight;
  }
  renderChat();

  document.getElementById('openRoom').onclick = () => {
    document.getElementById('roomLayer').style.transform = 'translateX(0)';
  };
  document.getElementById('backBtn').onclick = () => {
    document.getElementById('roomLayer').style.transform = 'translateX(100%)';
  };

  function floatDanmu(text) {
    const zone = document.getElementById('floatZone');
    const el = document.createElement('div');
    el.className = 'float-bubble';
    el.textContent = text;
    zone.appendChild(el);
    requestAnimationFrame(() => {
      el.style.transform = 'translateX(-260px)';
      el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 3100);
  }

  const danmuInput = document.getElementById('danmuInput');
  function sendDanmu() {
    const val = danmuInput.value.trim();
    if (!val) return;
    floatDanmu(val);
    chat.push({ av: 'a2', emoji: '🌱', name: '我', text: val, danmu: true });
    renderChat();
    danmuInput.value = '';
  }
  document.getElementById('sendDanmu').onclick = sendDanmu;
  danmuInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) sendDanmu();
  });

  const roomInput = document.getElementById('roomInput');
  function sendRoomMsg() {
    const val = roomInput.value.trim();
    if (!val) return;
    chat.push({ av: 'a2', emoji: '🌱', name: '我', text: val, danmu: false });
    renderChat();
    roomInput.value = '';
  }
  document.getElementById('sendRoom').onclick = sendRoomMsg;
  roomInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) sendRoomMsg();
  });
</script>
</body>
</html>
