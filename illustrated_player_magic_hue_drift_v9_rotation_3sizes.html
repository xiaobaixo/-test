<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手绘唱片机播放器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #e9e2f2;
    --ink: #3a3242;
    --ink-dim: rgba(58,50,66,0.55);
    --card: rgba(255,255,255,0.55);
    --card-border: rgba(255,255,255,0.7);
    --accent: #c9a6e0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; overflow:hidden; font-family:'Space Grotesk', sans-serif; color: var(--ink); background:#171519; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---- phone demo shell ---- */
  body{ display:flex; align-items:center; justify-content:center; }
  .phone-frame{
    position:relative; width:390px; height:844px; max-height:94vh;
    overflow:hidden; border-radius:44px; background: var(--paper);
    box-shadow: 0 50px 90px -30px rgba(0,0,0,0.55), 0 0 0 10px #111, 0 0 0 12px rgba(255,255,255,0.06);
  }

  .bg-layer{ position:absolute; inset:0; overflow:hidden; transition: opacity 1.8s ease, transform 0.25s ease-out; transform-origin:center center; }
  .bg-spin{ position:absolute; inset:-8%; animation: bgSpin 26s ease-in-out infinite alternate; transform-origin:center center; }
  .bg-drift{ position:absolute; inset:-6%; }
  .bg-drift svg{ width:100%; height:100%; display:block; }
  @keyframes bgSpin{ from{ transform: rotate(-3deg); } to{ transform: rotate(3deg); } }
  #bgB{ opacity:0; }

  /* ---- MAGIC HUE BRUSH FIELD: max 3, full element, true right-to-left drift ---- */
  .flow-layer{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:2;
    pointer-events:none;
  }

  .brush-el{
    position:absolute;
    left:0;
    top:0;
    opacity:0;
    pointer-events:none;
    transform-origin:center center;
    will-change:transform, opacity;
  }

  .brush-el canvas{
    width:100%;
    height:100%;
    display:block;
  }

  .brush-el{
    animation: brushFadeLife var(--life-time) ease-in-out both;
    animation-play-state:paused;
  }

  .flow-layer.playing .brush-el{
    animation-play-state:running;
  }

  @keyframes brushFadeLife{
    0%   { opacity:0; }
    7%   { opacity:var(--brush-opacity); }
    86%  { opacity:var(--brush-opacity); }
    100% { opacity:0; }
  }


  .stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:3; }

  .empty-hint{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-60%);
    text-align:center; pointer-events:none; z-index:6; color: var(--ink-dim);
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.03em;
    opacity:1; transition: opacity 0.4s ease;
  }
  .empty-hint.hidden{ opacity:0; }

  /* ---- turntable ---- */
  .turntable-wrap{ position:relative; width:min(195px, 52%); aspect-ratio:1/1; }
  .plinth{
    position:relative; width:100%; height:100%;
    background: linear-gradient(155deg, #ffffff, #f0f0f0);
    border-radius:28px; box-shadow: 0 30px 60px -20px rgba(58,50,66,0.35), 0 0 0 1px rgba(255,255,255,0.9) inset;
    display:flex; align-items:center; justify-content:center;
  }
  .record{
    position:relative; width:78%; aspect-ratio:1/1; border-radius:50%;
    background: repeating-radial-gradient(circle, #8a8a8f 0px, #8a8a8f 2px, #6f6f75 3px, #6f6f75 5px);
    box-shadow: 0 10px 26px rgba(0,0,0,0.22);
    animation: spin 6s linear infinite;
    animation-play-state: paused;
  }
  .record.playing{ animation-play-state: running; }
  .cover{
    position:absolute; inset:19%; border-radius:50%; overflow:hidden;
    background-color: var(--accent); background-size:cover; background-position:center;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.9), inset 0 0 0 1px rgba(0,0,0,0.08);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:26px; transition: background-color 1.2s ease;
  }
  .record::before{
    content:''; position:absolute; inset:48%; border-radius:50%; background:#fff; z-index:2;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .tonearm{
    position:absolute; top:8%; right:8%; width:34%; height:56%;
    transform-origin: 78% 10%;
    transform: rotate(-24deg);
    transition: transform 0.7s cubic-bezier(.4,1.4,.4,1);
    z-index:5;
  }
  .tonearm.dropped{ transform: rotate(4deg); }
  .tonearm svg{ width:100%; height:100%; overflow:visible; }



  /* ---- header ---- */
  .header{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; padding:18px 20px; z-index:7; pointer-events:none; }
  .badge{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
    color: var(--ink-dim); background: var(--card); border:1px solid var(--card-border); border-radius:20px;
    padding:6px 12px; backdrop-filter: blur(10px);
  }
  .error-badge{ color:#a3453a; background: rgba(255,235,230,0.85); }

  /* ---- bottom control bar ---- */
  .control-bar{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
    width:min(360px, 92%);
    background: var(--card); border:1px solid var(--card-border);
    backdrop-filter: blur(20px) saturate(160%);
    border-radius:22px; padding:12px 16px; z-index:10;
    box-shadow: 0 20px 40px -20px rgba(58,50,66,0.3);
  }
  .bar-top{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; }
  .thumb{
    width:34px; height:34px; border-radius:9px; flex-shrink:0; order:1;
    background: linear-gradient(135deg, var(--accent), #f2c9d8);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px;
  }
  .meta{ min-width:0; flex:1 1 100px; order:2; }
  .meta .title{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta .artist{ font-size:11px; color: var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .transport{ display:flex; align-items:center; gap:6px; flex-shrink:0; order:3; }
  button.iconbtn{
    background:none; border:none; cursor:pointer; color: var(--ink); opacity:0.7;
    display:flex; align-items:center; justify-content:center; padding:6px; border-radius:8px; transition: all 0.15s ease;
  }
  button.iconbtn:hover{ opacity:1; background: rgba(58,50,66,0.06); }
  button.iconbtn.active{ opacity:1; color:#8a5fb0; background: rgba(201,166,224,0.25); }
  button.iconbtn:disabled{ opacity:0.25; cursor:not-allowed; }
  button.iconbtn:disabled:hover{ background:none; }

  .play-btn{
    width:36px; height:36px; border-radius:50%; background: var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; flex-shrink:0;
  }
  .play-btn:hover{ background:#8a5fb0; }
  .play-btn svg{ width:13px; height:13px; }
  .play-btn:disabled{ opacity:0.35; cursor:not-allowed; background: var(--ink); }

  .progress-wrap{ flex:1 1 100%; order:4; display:flex; align-items:center; gap:8px; min-width:80px; }
  .time{ font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--ink-dim); width:30px; }
  .time.right{ text-align:right; }
  .progress-track{ flex:1; height:4px; background: rgba(58,50,66,0.12); border-radius:2px; position:relative; cursor:pointer; }
  .progress-fill{ position:absolute; left:0; top:0; height:100%; border-radius:2px; background: linear-gradient(90deg, #c9a6e0, #f2b6d0); width:0%; }
  .progress-knob{ position:absolute; top:50%; width:9px; height:9px; border-radius:50%; background:#fff; border:2px solid var(--accent); transform:translate(-50%,-50%); left:0%; }

  #shuffleBtn{ order:5; }
  #repeatBtn{ order:6; }
  .volume-wrap{ display:flex; align-items:center; gap:6px; flex-shrink:0; order:8; }
  .volume-track{ width:48px; height:4px; background: rgba(58,50,66,0.12); border-radius:2px; position:relative; cursor:pointer; }
  .volume-fill{ position:absolute; left:0; top:0; height:100%; border-radius:2px; background: var(--ink); width:80%; }

  .bar-bottom-row{ display:flex; justify-content:center; gap:8px; margin-top:10px; }
  .track-slot{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.02em; color: var(--ink-dim);
    padding:6px 12px; border:1px solid rgba(58,50,66,0.15); border-radius:20px; cursor:pointer; transition: all 0.15s ease;
    max-width:140px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .track-slot:hover{ color: var(--ink); border-color: var(--accent); background: rgba(201,166,224,0.12); }
  .track-slot.active{ color:#fff; background: var(--ink); border-color: var(--ink); }

  input[type=file]{ display:none; }
</style>
</head>
<body>
  <div class="phone-frame" id="dropzone">

  <div class="bg-layer" id="bgA"><div class="bg-spin"><div class="bg-drift"></div></div></div>
  <div class="bg-layer" id="bgB"><div class="bg-spin"><div class="bg-drift"></div></div></div>
  <div class="flow-layer" id="flowLayer"></div>

  <div class="header">
    <div class="badge" id="paletteBadge">PALETTE · violet dream</div>
    <div class="badge" id="errorBadge" style="display:none;"></div>
  </div>

  <div class="empty-hint mono" id="emptyHint">拖拽音频到此处，或点击下方上传两首歌<br>Magic Hue · 固定 超大 → 大 → 中 · 轻微旋转</div>

  <div class="stage">
    <div class="turntable-wrap">
      <div class="plinth">
        <div class="record" id="record">
          <div class="cover" id="coverArt">♪</div>
        </div>
      </div>
      <div class="tonearm" id="tonearm">
        <svg viewBox="0 0 100 160">
          <circle cx="82" cy="18" r="10" fill="#f4f4f6" stroke="#c7c7cc" stroke-width="2"/>
          <circle cx="82" cy="18" r="4" fill="#dcdce0"/>
          <line x1="82" y1="28" x2="82" y2="70" stroke="#e4e4e8" stroke-width="7" stroke-linecap="round"/>
          <line x1="82" y1="28" x2="82" y2="70" stroke="#c7c7cc" stroke-width="1.5"/>
          <path d="M82 70 Q82 108 30 138" fill="none" stroke="#e4e4e8" stroke-width="6" stroke-linecap="round"/>
          <path d="M82 70 Q82 108 30 138" fill="none" stroke="#c7c7cc" stroke-width="1.2"/>
          <ellipse cx="26" cy="142" rx="11" ry="7" fill="#f4f4f6" stroke="#c7c7cc" stroke-width="1.5"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="control-bar">
    <div class="bar-top">
      <div class="thumb" id="thumb">♪</div>
      <div class="meta">
        <div class="title" id="trackTitle">未加载</div>
        <div class="artist" id="trackArtist">拖拽或上传一首歌</div>
      </div>

      <div class="transport">
        <button class="iconbtn" id="prevBtn" disabled title="切到另一首">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
        </button>
        <button class="play-btn" id="playBtn" disabled>
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="iconbtn" id="nextBtn" disabled title="切到另一首">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
        </button>
      </div>

      <div class="progress-wrap">
        <span class="time mono" id="curTime">0:00</span>
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-knob" id="progressKnob"></div>
        </div>
        <span class="time right mono" id="durTime">0:00</span>
      </div>

      <button class="iconbtn" id="shuffleBtn" title="随机播放(占位)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      </button>
      <button class="iconbtn" id="repeatBtn" title="单曲循环">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>

      <div class="volume-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        <div class="volume-track" id="volumeTrack"><div class="volume-fill" id="volumeFill"></div></div>
      </div>
    </div>
    <div class="bar-bottom-row">
      <label class="track-slot mono" id="slot0" for="fileInput0">+ 歌曲 1</label>
      <label class="track-slot mono" id="slot1" for="fileInput1">+ 歌曲 2</label>
    </div>
  </div>

  <input type="file" id="fileInput0" accept="audio/*,.flac,.mp3,.wav,.m4a,.ogg">
  <input type="file" id="fileInput1" accept="audio/*,.flac,.mp3,.wav,.m4a,.ogg">

  </div>

    function rgbToHsv(r,g,b){
      r/=255; g/=255; b/=255;
      const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
      let h=0;
      if(d){
        if(max===r) h=60*(((g-b)/d)%6);
        else if(max===g) h=60*((b-r)/d+2);
        else h=60*((r-g)/d+4);
      }
      if(h<0) h+=360;
      return [h,max===0?0:d/max,max];
    }

    function hsvCss(h,s,v,a=1){
      h=((h%360)+360)%360;
      s=Math.max(0,Math.min(1,s)); v=Math.max(0,Math.min(1,v));
      const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
      let r=0,g=0,b=0;
      if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;}
      else if(h<180){g=c;b=x;} else if(h<240){g=x;b=c;}
      else if(h<300){r=x;b=c;} else {r=c;b=x;}
      r=Math.round((r+m)*255); g=Math.round((g+m)*255); b=Math.round((b+m)*255);
      return a===1 ? `rgb(${r}, ${g}, ${b})` : `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    async function extractMagicHue(url){

        }
        if(sw<=0) return 270;
        let h=Math.atan2(sy,sx)*180/Math.PI;
        return h<0?h+360:h;
      }catch(e){
        console.warn('Magic Hue extraction failed:',e);
        return 270;
      }
    }

    function buildMonoPalette(h){
      // SAME H everywhere. Only saturation + brightness/value change.
      return {
        name:'magic hue',
        colors:[
          hsvCss(h,.62,.72),
          hsvCss(h,.46,.82),
          hsvCss(h,.30,.90),
          hsvCss(h,.20,.95),
          hsvCss(h,.11,.98)
        ],
        paper:hsvCss(h,.075,.985)
      };
    }

    function applyMagicHueTheme(h, seedStr){
      magicHue=h;

      // One Hue only, but retain the ORIGINAL layered/painted background structure.
      const p={
        name:'magic hue',
        colors:[

    function brushTone(sizeClass){
      // ONE fixed Hue per song; size controls saturation/value.
      if(sizeClass==='xlarge'){
        return {
          // extra-large: paler than large, atmospheric but still readable
          color:hsvCss(magicHue,.14+Math.random()*.05,.91+Math.random()*.06),
          alpha:.48+Math.random()*.08
        };
      }
      if(sizeClass==='large'){
        return {
          // large: S 20–30 / B 86–93
          color:hsvCss(magicHue,.20+Math.random()*.10,.86+Math.random()*.07),
          alpha:.68+Math.random()*.10
        };
      }
      return {
        // medium: S 44–58 / B 68–80
        color:hsvCss(magicHue,.44+Math.random()*.14,.68+Math.random()*.12),
        alpha:.84+Math.random()*.09
      };
    }

    function hashString(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return Math.abs(h); }
    function mulberry32(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }

    let bgToggle = false;
    let paletteIndex = 0;

    function makeSpeckles(cx, cy, count, spread, color, rng){
      let out = '';
      for(let i=0;i<count;i++){
        const dx = (rng()-0.5)*spread*2;
        const dy = (rng()-0.5)*spread*2;
        const r = 2 + rng()*5;
        out += `<circle cx="${cx+dx}" cy="${cy+dy}" r="${r.toFixed(1)}" fill="${color}" opacity="${(0.25+rng()*0.4).toFixed(2)}"/>`;
      }
      return out;
    }

    function svgBackground(palette, rng){
      const [c1,c2,c3,c4,c5] = palette.colors;
      const seed = Math.floor(rng()*99999);
      const jitter = (r=40)=> (rng()-0.5)*r;
      return `
      <svg viewBox="0 0 800 1730" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="tex${seed}" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="${seed}" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="${16+rng()*12}"/>
          </filter>
        </defs>
        <rect width="800" height="1730" fill="${palette.paper}"/>

        <!-- soft diagonal wash bands (背景柔光色带,营造层次) -->
        <rect x="-150" y="560" width="1100" height="170" fill="${c2}" opacity="0.16" transform="rotate(-7 400 640)"/>
        <rect x="-150" y="720" width="1100" height="130" fill="${c5}" opacity="0.14" transform="rotate(-7 400 780)"/>

        <g filter="url(#tex${seed})" opacity="0.88">
          <!-- 左侧大弧线笔触,沿边缘延伸出画布 -->
          <path d="M-60 -20 Q60 260 -40 560 Q-110 800 10 1040" fill="none" stroke="${c2}" stroke-width="100" stroke-linecap="round" opacity="0.48"/>

          <!-- 圆环笔触 -->
          <circle cx="${180+jitter()}" cy="${150+jitter()}" r="88" fill="none" stroke="${c4}" stroke-width="26" opacity="0.55"/>

          <!-- 中段小色块笔触 -->
          <ellipse cx="${610+jitter(50)}" cy="${640+jitter(50)}" rx="90" ry="60" fill="${c4}" opacity="0.32"/>

          <!-- 底部大色块笔触(带飞溅质感) -->
          <ellipse cx="${190+jitter(60)}" cy="${1220+jitter(60)}" rx="180" ry="135" fill="${c1}" opacity="0.55"/>
          <ellipse cx="${430+jitter(60)}" cy="${1360+jitter(60)}" rx="165" ry="110" fill="${c5}" opacity="0.5"/>
          <ellipse cx="${590+jitter(60)}" cy="${1180+jitter(60)}" rx="115" ry="95" fill="${c3}" opacity="0.4"/>

          <!-- 小圆环收尾笔触 -->
          <circle cx="${300+jitter(40)}" cy="${1600+jitter(40)}" r="55" fill="none" stroke="${c4}" stroke-width="15" opacity="0.4"/>

          ${makeSpeckles(150+jitter(40), 1120+jitter(40), 22, 95, c5, rng)}
          ${makeSpeckles(560+jitter(40), 620+jitter(40), 14, 70, c2, rng)}
        </g>
      </svg>`;
    }

    let currentPaletteColors = PALETTES[0].colors;

    function applyPalette(idx, seedStr){
      const palette = PALETTES[idx % PALETTES.length];
      const rng = mulberry32(hashString(seedStr));
      const html = svgBackground(palette, rng);
      const showing = bgToggle ? document.getElementById('bgB') : document.getElementById('bgA');
      const hiding  = bgToggle ? document.getElementById('bgA') : document.getElementById('bgB');

      document.documentElement.style.setProperty('--accent', palette.colors[0]);
      document.querySelector('.phone-frame').style.background = palette.paper;
    }
    applyPalette(0, 'idle-seed');

    // ---- SAFE-ZONE DRIFT SYSTEM ----
    // Rules:
    // 1) at most 3 brushes
    // 2) unique shapes on screen
    // 3) enter one-by-one, not all at once
    // 4) avoid the turntable/player body
    // 5) keep 2–3 brushes alive whenever possible
    const flowLayer=document.getElementById('flowLayer');
    const brushInstances=[];
    let lastBrushFrame=performance.now();
    let lastSpawnAt=0;

    // Sequential rhythm: enough spacing to feel intentional,
    // but short enough that the screen does not become empty.
    const SPAWN_MIN_MS=1950;
    const SPAWN_MAX_MS=2550;
    let nextSpawnDelay=2100;

    function randomSpawnDelay(){
      return SPAWN_MIN_MS+Math.random()*(SPAWN_MAX_MS-SPAWN_MIN_MS);
    }

    let sizeSequenceIndex = 0;
    function chooseSizeClass(){
      // Fixed repeating visual order: 超大 → 大 → 中.
      // Three tiers: 400–500 → 200–300 → 100–150 px.
      const sequence = ['xlarge', 'large', 'medium'];
      const cls = sequence[sizeSequenceIndex % sequence.length];
      sizeSequenceIndex++;
      return cls;
    }

    function widthForClass(cls,fw){
      if(cls==='xlarge') return 400+Math.random()*100; // 400–500 px
      if(cls==='large')  return 200+Math.random()*100; // 200–300 px
      return 100+Math.random()*50;                     // 100–150 px
    }

    function tintFullBrush(inst){
      if(!inst.ready) return;
      const {ctx,canvas,img,color,alpha}=inst;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      ctx.globalCompositeOperation='source-in';
      ctx.globalAlpha=alpha;
      ctx.fillStyle=color;
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=1;
    }

    function usedAssetNames(){
      return new Set(brushInstances.map(b=>b.assetName));
    }

    function pickUnusedBrush(){
      const used=usedAssetNames();
      const available=USER_BRUSHES.filter(a=>!used.has(a.name));
      if(!available.length) return null;
      return available[Math.floor(Math.random()*available.length)];
    }

    function getSafeVerticalZones(frame,h){
      const fh=frame.clientHeight||844;
      const frameRect=frame.getBoundingClientRect();
      const turntable=document.querySelector('.turntable-wrap');
      const controls=document.querySelector('.control-bar');

      const ttRect=turntable.getBoundingClientRect();
      const ctlRect=controls.getBoundingClientRect();

      const ttTop=ttRect.top-frameRect.top;
      const ttBottom=ttRect.bottom-frameRect.top;
      const ctlTop=ctlRect.top-frameRect.top;

      const margin=16;

      // Primary "orange-circle" air zone above the turntable.
      const topZone={
        min:48,
        max:Math.max(48,ttTop-h-22)
      };

      // Secondary air zone between the turntable and control bar.
      const bottomZone={
        min:ttBottom+18,
        max:ctlTop-h-18
      };

      const zones=[];
      if(topZone.max-topZone.min>18) zones.push({name:'top',...topZone});
      if(bottomZone.max-bottomZone.min>18) zones.push({name:'bottom',...bottomZone});

      // Fallback: still keep it away from the control panel.
      if(!zones.length){
        zones.push({
          name:'fallback',
          min:48,
          max:Math.max(48,ctlTop-h-24)
        });
      }
      return zones;
    }

    function pickSafeY(frame,h){
      const zones=getSafeVerticalZones(frame,h);

      // Prefer a zone that currently has fewer brushes.
      const occupancy={top:0,bottom:0,fallback:0};
      brushInstances.forEach(b=>{
        occupancy[b.zoneName]=(occupancy[b.zoneName]||0)+1;
      });

      zones.sort((a,b)=>(occupancy[a.name]||0)-(occupancy[b.name]||0));
      const bestCount=occupancy[zones[0].name]||0;
      const candidates=zones.filter(z=>(occupancy[z.name]||0)===bestCount);
      const zone=candidates[Math.floor(Math.random()*candidates.length)];

      // Within a zone, try several y positions and choose one farthest
      // from existing brushes so they do not heavily overlap.
      let bestY=zone.min;
      let bestScore=-1;
      for(let attempt=0;attempt<12;attempt++){
        const y=zone.min+Math.random()*Math.max(1,zone.max-zone.min);
        let nearest=9999;
        brushInstances.forEach(b=>{
          nearest=Math.min(nearest,Math.abs((b.currentY||b.startY)-y));
        });
        if(nearest>bestScore){
          bestScore=nearest;
          bestY=y;
        }
      }
      return {y:bestY,zoneName:zone.name};
    }

    function canSpawnNow(force=false){
      if(audio.paused || !magicHueReady) return false;
      if(brushInstances.length>=3) return false;
      if(force) return true;

      // Do not stack new brushes at the right edge.
      // Wait until the newest brush has visibly entered the screen.
      const frameW=document.querySelector('.phone-frame').clientWidth||390;
      const newest=brushInstances[brushInstances.length-1];
      if(newest && newest.currentX > frameW*.74) return false;

      return true;
    }

    function spawnMovingBrush(force=false){
      if(!canSpawnNow(force)) return false;

      const asset=pickUnusedBrush();
      if(!asset) return false;

      const frame=document.querySelector('.phone-frame');
      const fw=frame.clientWidth||390;
      const fh=frame.clientHeight||844;

      const cls=chooseSizeClass();
      let w=widthForClass(cls,fw);
      const ratio=asset.w/asset.h;
      let h=w/ratio;

      // Keep the complete artwork reasonably sized.
      const maxH=cls==='xlarge' ? fh*.62 : cls==='large' ? fh*.40 : fh*.25;
      if(h>maxH){
        h=maxH;
        w=h*ratio;
      }

      // Completely outside the right edge before entering.
      const startX=fw+18+Math.random()*20;
      const safe=pickSafeY(frame,h);
      const startY=safe.y;

      const el=document.createElement('div');
      el.className='brush-el';
      el.style.width=w+'px';
      el.style.height=h+'px';

      const tone=brushTone(cls);
      const opacity=cls==='xlarge' ? .54 : cls==='large' ? .74 : .90;

      // Enough lifetime for a smooth, readable crossing.
      const life=10.2+Math.random()*2.8;
      el.style.setProperty('--life-time',life+'s');
      el.style.setProperty('--brush-opacity',opacity);

      const canvas=document.createElement('canvas');
      const dpr=2;
      canvas.width=Math.max(2,Math.round(w*dpr));
      canvas.height=Math.max(2,Math.round(h*dpr));
      el.appendChild(canvas);
      flowLayer.appendChild(el);

      const img=new Image();
      const inst={
        el,
        canvas,
        ctx:canvas.getContext('2d'),
        img,
        ready:false,
        assetName:asset.name,
        sizeClass:cls,
        color:tone.color,
        alpha:tone.alpha,
        startX,
        startY,
        currentX:startX,
        currentY:startY,
        zoneName:safe.zoneName,
        endX:-w-28,
        life,
        age:0,
        phase:Math.random()*Math.PI*2,
        bobAmp:cls==='xlarge'?7:cls==='large'?6:4.5,
        rot0:(Math.random()-.5)*5,
        rotDelta:(Math.random()-.5)*4,
        rotWobble:1.2+Math.random()*1.6,
        rotSpeed:.55+Math.random()*.35
      };

      img.onload=()=>{
        inst.ready=true;
        tintFullBrush(inst);
      };
      img.src=asset.data;
      brushInstances.push(inst);

      if(!audio.paused) flowLayer.classList.add('playing');
      return true;
    }

    // Beat can help fill the field, but never creates a pile-up.
    function forceRespawnOnBeat(){
      if(audio.paused || !magicHueReady) return;
      if(brushInstances.length<2) spawnMovingBrush(false);
    }

    function brushAnimationLoop(now){
      requestAnimationFrame(brushAnimationLoop);
      const dt=Math.min(.05,(now-lastBrushFrame)/1000||0);
      lastBrushFrame=now;

      // Pause freezes position AND fade animation.
      if(audio.paused) return;

      // Sequential replenishment:
      // - if only 0–1 remain, refill sooner
      // - if 2 remain, use the normal interval
      const urgent=brushInstances.length<=1;
      const targetDelay=urgent ? Math.min(nextSpawnDelay,1250) : nextSpawnDelay;

      if(now-lastSpawnAt>=targetDelay){
        if(spawnMovingBrush(false)){
          lastSpawnAt=now;
          nextSpawnDelay=randomSpawnDelay();
        }
      }

      for(let i=brushInstances.length-1;i>=0;i--){
        const b=brushInstances[i];
        if(!b.ready) continue;

        b.age+=dt;
        const p=Math.min(1,b.age/b.life);

        // Full right-to-left crossing.
        const x=b.startX+(b.endX-b.startX)*p;

        // Very small vertical motion, so it stays in its safe lane.
        const y=b.startY+Math.sin(p*Math.PI*2+b.phase)*b.bobAmp;
        const rot=b.rot0+b.rotDelta*p + Math.sin(b.phase + b.age*b.rotSpeed)*b.rotWobble;

        b.currentX=x;
        b.currentY=y;

        b.el.style.transform=
          `translate3d(${x}px,${y}px,0) rotate(${rot}deg)`;

        if(p>=1){
          b.el.remove();
          brushInstances.splice(i,1);
        }
      }
    }
    requestAnimationFrame(brushAnimationLoop);

    // ================= audio =================
    const audio = new Audio();
    const record = document.getElementById('record');

    // ---- 仅用于节拍检测的音频分析(不再驱动整体缩放/律动) ----
    let audioCtx=null, analyser=null, freqData=null;
    function ensureAudioGraph(){
      if(audioCtx) return;
      try{
        audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.6;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        const sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser); analyser.connect(audioCtx.destination);
      }catch(e){ console.warn('音频分析初始化失败,节拍效果将不可用:', e.message); }
    }
    function getBassEnergy(){
      if(!analyser) return 0;
      analyser.getByteFrequencyData(freqData);
      const n = Math.max(1, Math.floor(freqData.length*0.18));
      let s=0; for(let i=0;i<n;i++) s+=freqData[i];
      return s/n/255;
    }
    let bassAvg=0, bassPeak=0, lastBeatTime=0;
    function beatLoop(){
      requestAnimationFrame(beatLoop);
      if(!audio.paused && analyser){
        const bass = getBassEnergy();
        bassAvg += (bass-bassAvg)*0.08;
        bassPeak = Math.max(bass, bassPeak*0.985); // 记录一个缓慢衰减的峰值,用来做相对判断,避免响度不同的歌曲阈值失灵
        const now = performance.now();
        const rel = bass - bassAvg;
        if(rel > 0.05 && bass > bassPeak*0.55 && bass > 0.06 && now-lastBeatTime > 180){
          lastBeatTime = now;
          forceRespawnOnBeat();
        }
      }
    }
    requestAnimationFrame(beatLoop);

    // ================= UI wiring =================
    const fileInput0=document.getElementById('fileInput0'), fileInput1=document.getElementById('fileInput1');
    const slot0=document.getElementById('slot0'), slot1=document.getElementById('slot1');
    const coverArt=document.getElementById('coverArt');
    const prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn');
    const trackTitle=document.getElementById('trackTitle'), trackArtist=document.getElementById('trackArtist');
    const playBtn=document.getElementById('playBtn'), playIcon=document.getElementById('playIcon');
    const emptyHint=document.getElementById('emptyHint');
    const tonearm=document.getElementById('tonearm');
    const progressTrack=document.getElementById('progressTrack'), progressFill=document.getElementById('progressFill'), progressKnob=document.getElementById('progressKnob');
    const curTime=document.getElementById('curTime'), durTime=document.getElementById('durTime');
    const errorBadge=document.getElementById('errorBadge');
    const volumeTrack=document.getElementById('volumeTrack'), volumeFill=document.getElementById('volumeFill');
    const repeatBtn=document.getElementById('repeatBtn'), shuffleBtn=document.getElementById('shuffleBtn');

    const ICON_PLAY='<path d="M8 5v14l11-7z"/>', ICON_PAUSE='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
    const AUDIO_EXT=/\.(mp3|flac|wav|m4a|ogg|aac|webm|opus)$/i;

    function fmtTime(s){ if(!isFinite(s)) return '0:00'; const m=Math.floor(s/60), sec=Math.floor(s%60); return m+':'+sec.toString().padStart(2,'0'); }
    function showError(msg){ errorBadge.textContent='⚠ '+msg; errorBadge.style.display='inline-block'; errorBadge.classList.add('error-badge'); console.error(msg); }
    function clearError(){ errorBadge.style.display='none'; }

    audio.volume = 0.8;
    volumeFill.style.width = '80%';

    // ---- 从mp3的ID3v2标签里提取内嵌封面(APIC帧),没有就返回null ----
    function extractID3Cover(buf){
      try{
        const view = new DataView(buf);
        if(view.getUint8(0)!==0x49||view.getUint8(1)!==0x44||view.getUint8(2)!==0x33) return null; // "ID3"
        const version = view.getUint8(3);
        const flags = view.getUint8(5);
        const size = ((view.getUint8(6)&0x7f)<<21)|((view.getUint8(7)&0x7f)<<14)|((view.getUint8(8)&0x7f)<<7)|(view.getUint8(9)&0x7f);
        let offset = 10;
        const tagEnd = 10+size;
        if(flags & 0x40){ // extended header present, skip it
          const extSize = (version===4)
            ? ((view.getUint8(offset)&0x7f)<<21)|((view.getUint8(offset+1)&0x7f)<<14)|((view.getUint8(offset+2)&0x7f)<<7)|(view.getUint8(offset+3)&0x7f)
            : view.getUint32(offset);
          offset += extSize;
        }
        while(offset < tagEnd - 10){
          const frameId = String.fromCharCode(view.getUint8(offset),view.getUint8(offset+1),view.getUint8(offset+2),view.getUint8(offset+3));
          let frameSize;
          if(version===4){
            frameSize = ((view.getUint8(offset+4)&0x7f)<<21)|((view.getUint8(offset+5)&0x7f)<<14)|((view.getUint8(offset+6)&0x7f)<<7)|(view.getUint8(offset+7)&0x7f);
          } else {
            frameSize = view.getUint32(offset+4);
          }
          if(frameSize<=0 || frameId==='\0\0\0\0') break;
          const frameStart = offset+10;
          if(frameId==='APIC'){
            let p = frameStart;
            const enc = view.getUint8(p); p+=1;
            let mimeEnd=p;
            while(view.getUint8(mimeEnd)!==0 && mimeEnd<frameStart+frameSize) mimeEnd++;
            const mime = new TextDecoder('ascii').decode(new Uint8Array(buf,p,mimeEnd-p)) || 'image/jpeg';
            p = mimeEnd+1;
            p+=1; // picture type byte
            let descEnd=p;
            if(enc===1||enc===2){
              while(!(view.getUint8(descEnd)===0 && view.getUint8(descEnd+1)===0) && descEnd<frameStart+frameSize) descEnd+=2;
              descEnd+=2;
            } else {
              while(view.getUint8(descEnd)!==0 && descEnd<frameStart+frameSize) descEnd++;
              descEnd+=1;
            }
            const imgBytes = new Uint8Array(buf, descEnd, (frameStart+frameSize)-descEnd);
            return URL.createObjectURL(new Blob([imgBytes], {type:mime}));
          }
          offset = frameStart+frameSize;
        }
      }catch(e){ /* 解析失败就用占位图 */ }
      return null;
    }

    function setCover(url){
      if(url){ coverArt.style.backgroundImage = `url(${url})`; coverArt.textContent=''; }
      else { coverArt.style.backgroundImage=''; coverArt.textContent='♪'; }
    }

    // ---- 两首歌槽位 ----
    let tracks = [null, null];
    let activeSlot = -1;
    const slotEls = [slot0, slot1];

    function updateSlotUI(){
      slotEls.forEach((el, i)=>{
        const t = tracks[i];
        el.textContent = t ? t.name : ('+ 歌曲 ' + (i+1));
        el.classList.toggle('active', i===activeSlot);
      });
      const bothLoaded = !!(tracks[0] && tracks[1]);
      prevBtn.disabled = !bothLoaded;
      nextBtn.disabled = !bothLoaded;
    }

    function switchTrack(idx){
      const t = tracks[idx];
      if(!t) return;
      activeSlot = idx;
      audio.pause();
      audio.src = t.blobUrl; audio.load(); clearError();
      trackTitle.textContent = t.name;
      trackArtist.textContent = t.artist;
      setCover(t.coverUrl);

      // A new song starts a completely new one-hue visual field.
      magicHueReady=false;
      brushInstances.splice(0).forEach(b=>b.el.remove());
      flowLayer.innerHTML='';

      // Do not use a pre-made multicolor palette for the song.
      // Extract ONE hue from the cover first; only then allow brush generation.
      extractMagicHue(t.coverUrl).then(h=>{
        if(activeSlot===idx){
          applyMagicHueTheme(h,t.seedStr);
          magicHueReady=true;
          // Fill the field quickly at song start.
          if(!audio.paused){
            // One-by-one entry. The next one waits until the previous
            // has already moved into the composition.
            spawnMovingBrush(true);
            setTimeout(()=>{
              if(!audio.paused && brushInstances.length<3) spawnMovingBrush(false);
            },1850);
            setTimeout(()=>{
              if(!audio.paused && brushInstances.length<3) spawnMovingBrush(false);
            },3700);
          }
        }
      });
      updateSlotUI();
      playBtn.disabled = false;
      ensureAudioGraph(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
      audio.play().then(()=>{ playIcon.innerHTML=ICON_PAUSE; record.classList.add('playing'); tonearm.classList.add('dropped'); flowLayer.classList.add('playing'); })
        .catch((err)=>{ playIcon.innerHTML=ICON_PLAY; console.warn('Autoplay blocked:', err.message); });
    }

    function loadToSlot(file, idx){
      if(!file) return;
      const looksLikeAudio = file.type.startsWith('audio') || AUDIO_EXT.test(file.name);
      if(!looksLikeAudio){ showError('不是音频文件: ' + file.name); return; }
      const reader = new FileReader();
      reader.onerror = ()=> showError('文件读取失败: ' + (reader.error? reader.error.message:'未知错误'));
      reader.onload = ()=>{
        const buf = reader.result;
        const blobUrl = URL.createObjectURL(new Blob([buf], {type: file.type || 'audio/mpeg'}));
        const coverUrl = extractID3Cover(buf);
        paletteIndex = (paletteIndex+1) % PALETTES.length;
        tracks[idx] = {
          name: file.name.replace(/\.[^/.]+$/, ''),
          artist: '本地文件',
          blobUrl, coverUrl,
          paletteIndex,
          seedStr: file.name+'-'+file.size+'-'+file.lastModified
        };
        clearError();
        emptyHint.classList.add('hidden');
        updateSlotUI();
        switchTrack(idx);
      };
      reader.readAsArrayBuffer(file);
    }

    audio.addEventListener('error', ()=>{
      const codes={1:'加载被中断',2:'网络错误',3:'解码失败(格式可能不受支持)',4:'不支持该音频格式'};
      const err=audio.error; if(err) showError('播放出错: '+(codes[err.code]||err.message||'未知错误'));
    });

    fileInput0.addEventListener('change', (e)=>{ if(e.target.files[0]) loadToSlot(e.target.files[0], 0); e.target.value=''; });
    fileInput1.addEventListener('change', (e)=>{ if(e.target.files[0]) loadToSlot(e.target.files[0], 1); e.target.value=''; });

    // 已加载的槽位点一下就是切歌,而不是重新弹出文件选择框
    slot0.addEventListener('click', (e)=>{ if(tracks[0]){ e.preventDefault(); if(activeSlot!==0) switchTrack(0); } });
    slot1.addEventListener('click', (e)=>{ if(tracks[1]){ e.preventDefault(); if(activeSlot!==1) switchTrack(1); } });

    prevBtn.addEventListener('click', ()=>{ if(tracks[0]&&tracks[1]) switchTrack(activeSlot===0?1:0); });
    nextBtn.addEventListener('click', ()=>{ if(tracks[0]&&tracks[1]) switchTrack(activeSlot===0?1:0); });

    const dz=document.getElementById('dropzone');
    ['dragenter','dragover'].forEach(ev=> dz.addEventListener(ev,(e)=>{e.preventDefault();}));
    dz.addEventListener('drop',(e)=>{
      e.preventDefault();
      const f=e.dataTransfer.files[0]; if(!f) return;
      const idx = !tracks[0] ? 0 : (!tracks[1] ? 1 : (activeSlot===0?1:0));
      loadToSlot(f, idx);
    });

    playBtn.addEventListener('click', ()=>{
      ensureAudioGraph(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
      if(audio.paused) audio.play(); else audio.pause();
    });
    audio.addEventListener('play', ()=>{
      playIcon.innerHTML=ICON_PAUSE;
      record.classList.add('playing');
      tonearm.classList.add('dropped');
      flowLayer.classList.add('playing');

      // If resuming with fewer than 3, refill quickly.
      if(magicHueReady && brushInstances.length===0){
        spawnMovingBrush(true);
      }
      // If 1–2 brushes already exist, the normal queue will refill them sequentially.
    });
    audio.addEventListener('pause', ()=>{
      playIcon.innerHTML=ICON_PLAY;
      record.classList.remove('playing');
      tonearm.classList.remove('dropped');
      flowLayer.classList.remove('playing');
    });
    audio.addEventListener('ended', ()=>{
      playIcon.innerHTML=ICON_PLAY;
      record.classList.remove('playing');
      tonearm.classList.remove('dropped');
      flowLayer.classList.remove('playing');
    });

    audio.addEventListener('timeupdate', ()=>{
      const pct = audio.duration? (audio.currentTime/audio.duration)*100:0;
      progressFill.style.width=pct+'%'; progressKnob.style.left=pct+'%';
      curTime.textContent=fmtTime(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata', ()=>{ durTime.textContent=fmtTime(audio.duration); });
    progressTrack.addEventListener('click',(e)=>{
      if(!audio.duration) return;
      const rect=progressTrack.getBoundingClientRect();
      audio.currentTime = ((e.clientX-rect.left)/rect.width)*audio.duration;
    });

    volumeTrack.addEventListener('click',(e)=>{
      const rect=volumeTrack.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX-rect.left)/rect.width));
      audio.volume = pct; volumeFill.style.width = (pct*100)+'%';
    });

    repeatBtn.addEventListener('click', ()=>{
      repeatBtn.classList.toggle('active');
      audio.loop = repeatBtn.classList.contains('active');
    });
    shuffleBtn.addEventListener('click', ()=>{ shuffleBtn.classList.toggle('active'); });

  })();
  </script>
</body>
</html>
