<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐迷答案之书</title>
<style>
  :root{
    --ink: #14151b;
    --paper: #f4efe4;
    --paper-dim: #e9e1cd;
    --gold: #d9a94e;
    --rose: #b0563f;
    --line: rgba(244,239,228,0.14);
    --vinyl: #1b1c22;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{ height:100%; }
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    background: radial-gradient(circle at 50% 0%, #1d1f28 0%, var(--ink) 55%);
    font-family: "Songti SC","STSong","Noto Serif SC", serif;
    color: var(--paper);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  .sans{ font-family:"Helvetica Neue", Arial, sans-serif; }
  .stage{
    width:100%; max-width:420px;
    height:100vh; height:100dvh; max-height:860px;
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }

  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center;
    padding: 34px 24px 26px;
    opacity:0; pointer-events:none;
    transform: translateY(12px);
    transition: opacity .32s ease, transform .32s ease;
  }
  .screen.active{ opacity:1; pointer-events:auto; transform:translateY(0); }

  .eyebrow{ font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color: var(--gold); opacity:0.85; margin-bottom:6px; }
  .artist-name{ font-size:22px; font-weight:600; letter-spacing:0.04em; margin: 0 0 2px; font-family:'Songti SC',serif; }
  .subtitle{ font-size:12px; color: rgba(244,239,228,0.5); letter-spacing:0.02em; margin-bottom: 20px; }
  .back-btn{
    position:absolute; top:30px; left:22px; z-index:8;
    width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line); background:rgba(244,239,228,0.04);
    display:flex; align-items:center; justify-content:center;
    color: var(--paper); font-size:15px; cursor:pointer;
  }

  /* ================= HOME ================= */
  #screen-home{ justify-content:flex-start; padding-top: 64px; }
  .type-grid{ width:100%; max-width:320px; display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top: 30px; }
  .type-card{
    aspect-ratio: 1 / 0.92; border-radius:16px;
    background: linear-gradient(160deg, rgba(244,239,228,0.07), rgba(244,239,228,0.02));
    border:1px solid var(--line);
    display:flex; flex-direction:column; justify-content:space-between;
    padding:16px; cursor:pointer;
    transition: transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .type-card:active{ transform: scale(0.96); }
  .type-card:hover{ border-color: rgba(217,169,78,0.5); }
  .type-num{ font-size:11px; color: var(--gold); opacity:0.8; }
  .type-label{ font-size:17px; font-weight:600; line-height:1.3; font-family:'Songti SC',serif; }
  .type-desc{ font-size:10.5px; color: rgba(244,239,228,0.4); margin-top:4px; }
  .home-vinyl{
    position:absolute; bottom:-90px; left:50%; margin-left:-160px;
    width:320px; height:320px; border-radius:50%; z-index:-1;
    background: repeating-radial-gradient(circle at 50% 50%, var(--vinyl) 0px, var(--vinyl) 2px, #202128 3px, #202128 4px);
    opacity:0.5;
  }

  /* ================= CATEGORY (quick cards + custom input) ================= */
  #screen-category{ justify-content:flex-start; padding-top: 84px; overflow-y:auto; }
  .cat-title{ font-size:19px; font-weight:600; margin-bottom:4px; font-family:'Songti SC',serif; }
  .cat-sub{ font-size:12px; color:rgba(244,239,228,0.45); margin-bottom:20px; }
  .section-label{
    width:100%; max-width:320px; font-size:11px; letter-spacing:0.12em;
    color: rgba(244,239,228,0.4); text-transform:uppercase; margin: 4px 0 10px;
  }
  .q-list{ width:100%; max-width:320px; display:flex; flex-direction:column; gap:9px; margin-bottom:22px; }
  .q-card{
    padding:14px 16px; border-radius:14px;
    background: rgba(244,239,228,0.05); border:1px solid var(--line);
    font-size:14px; line-height:1.5; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    transition: border-color .2s ease, background .2s ease, transform .15s ease;
  }
  .q-card:active{ transform: scale(0.98); }
  .q-card:hover{ border-color: rgba(217,169,78,0.5); background: rgba(244,239,228,0.08); }
  .q-card .go{ color: var(--gold); font-size:13px; opacity:0.7; flex-shrink:0; margin-left:10px; }

  .custom-box{ width:100%; max-width:320px; padding-bottom: 20px; }
  .custom-input{
    width:100%; min-height:76px; resize:none;
    border-radius:14px; border:1px solid var(--line);
    background: rgba(244,239,228,0.04); color:var(--paper);
    font-family:"Songti SC","Noto Serif SC",serif; font-size:14px;
    padding:14px; line-height:1.6; outline:none;
  }
  .custom-input:focus{ border-color: var(--gold); }
  .custom-input::placeholder{ color: rgba(244,239,228,0.28); }
  .draw-btn{
    margin-top:12px; width:100%; padding:13px; border-radius:999px;
    border:1px solid var(--gold); background: transparent; color: var(--gold);
    font-size:13.5px; letter-spacing:0.08em; cursor:pointer;
    transition: background .2s ease, color .2s ease;
  }
  .draw-btn:active{ background: var(--gold); color: var(--ink); }

  /* ================= BOOK (swipe the cover to start) ================= */
  #screen-book{ align-items:center; justify-content:flex-start; padding-top: 70px; }
  .book-question{
    font-size:12.5px; color: var(--gold); opacity:0.9; margin-bottom:26px;
    max-width:280px; text-align:center; letter-spacing:0.02em; line-height:1.6;
  }
  .book-vinyl{
    position:absolute; width:290px; height:290px; top:150px; border-radius:50%; z-index:-1;
    background: repeating-radial-gradient(circle at 50% 50%, var(--vinyl) 0px, var(--vinyl) 2px, #202128 3px, #202128 4px);
    opacity:0.7;
  }
  .book-wrap{
    position:relative; width:270px; height:380px;
    perspective: 1600px;
  }
  .book-wrap::before{
    content:"";
    position:absolute; left:-2px; top:6px; bottom:6px; width:14px;
    background: linear-gradient(90deg, rgba(0,0,0,0.55), transparent);
    border-radius: 6px 0 0 6px; z-index:1; pointer-events:none;
  }
  .book-back{
    position:absolute; inset:0; border-radius: 6px 16px 16px 6px;
    background: linear-gradient(160deg, #f6f0e2 0%, #ece3cd 60%, #e4d9bf 100%);
    box-shadow: 0 18px 50px -12px rgba(0,0,0,0.4);
  }
  .book-cover{
    position:absolute; inset:0; border-radius: 6px 16px 16px 6px;
    background: linear-gradient(155deg, #262731 0%, var(--ink) 55%, #1a1b21 100%);
    border: 1px solid rgba(217,169,78,0.35);
    box-shadow: 0 24px 70px -14px rgba(0,0,0,0.65);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    cursor:grab; touch-action: pan-y; will-change: transform;
    transform-style: preserve-3d;
    transform-origin: 0% 50%;
    backface-visibility: hidden;
    z-index: 2;
  }
  .book-cover:active{ cursor:grabbing; }
  .book-cover::after{
    content:"";
    position:absolute; top:3%; bottom:3%; right:-4px; width:7px;
    background: repeating-linear-gradient(to bottom, #d8c79c 0px, #d8c79c 2px, #bfa876 2px, #bfa876 3px);
    border-radius: 0 4px 4px 0;
    box-shadow: 2px 0 6px rgba(0,0,0,0.3);
  }
  .closed-emblem{
    width:50px; height:50px; border-radius:50%; border:1px solid var(--gold);
    display:flex; align-items:center; justify-content:center; color: var(--gold); font-size:19px; opacity:0.85;
  }
  .closed-text{ font-size:12.5px; color: rgba(244,239,228,0.55); letter-spacing:0.04em; }
  .book-hint{
    margin-top:18px; font-size:12px; color: rgba(244,239,228,0.4);
    display:flex; align-items:center; gap:8px; transition: opacity .3s ease;
  }
  .book-hint .arrow{ color: var(--gold); font-size:14px; }

  /* ================= FLIP (big, obvious multi-page transition) ================= */
  #screen-flip{ align-items:center; justify-content:center; }
  .flip-vinyl{
    position:absolute; width:280px; height:280px; border-radius:50%;
    background: repeating-radial-gradient(circle at 50% 50%, var(--vinyl) 0px, var(--vinyl) 2px, #202128 3px, #202128 4px);
    animation: spin 0.8s linear infinite; opacity:0.4; z-index:-1;
  }
  .flip-stack{ position:relative; width:250px; height:340px; perspective:1200px; }
  .flip-page{
    position:absolute; inset:0; border-radius:14px;
    background: linear-gradient(160deg, #fbf6ea, var(--paper-dim));
    box-shadow: 0 16px 40px -10px rgba(0,0,0,0.55);
    transform-origin: left center;
    backface-visibility: hidden;
  }
  .flip-caption{ margin-top:28px; font-size:12.5px; color: rgba(244,239,228,0.55); letter-spacing:0.08em; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ================= RESULT (single revealed card) ================= */
  #screen-result{ align-items:center; justify-content:center; }
  .result-vinyl{
    position:absolute; width:300px; height:300px; border-radius:50%; z-index:-1;
    background: repeating-radial-gradient(circle at 50% 50%, var(--vinyl) 0px, var(--vinyl) 2px, #202128 3px, #202128 4px);
    opacity:0.55;
  }
  .result-card{
    position:relative; width:290px; min-height:400px; border-radius:20px;
    background: linear-gradient(160deg, #fbf6ea 0%, var(--paper) 55%, #ece4d2 100%);
    color: var(--ink);
    box-shadow: 0 24px 70px -14px rgba(0,0,0,0.6), 0 2px 0 rgba(0,0,0,0.05) inset;
    padding: 30px 28px 26px;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    animation: cardIn .5s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes cardIn{
    0%{ opacity:0; transform: scale(0.9) rotate(-2deg); }
    100%{ opacity:1; transform: scale(1) rotate(0); }
  }
  .result-mark{ position:absolute; top:16px; right:18px; width:22px; height:22px; border-radius:50%; border:1px solid var(--gold); opacity:0.5; }
  .result-question{
    font-size:12.5px; color: var(--rose); letter-spacing:0.02em; line-height:1.6;
    padding-bottom:16px; margin-bottom:18px; border-bottom:1px solid rgba(20,21,27,0.12);
    width:100%;
  }
  .result-question .qlabel{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; opacity:0.7; display:block; margin-bottom:5px; }

  .lyric-wrap{ position:relative; padding: 6px 10px; }
  .lyric-wrap .stars{ position:absolute; inset:-14px; pointer-events:none; }
  .star{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background: var(--gold); box-shadow: 0 0 7px 1.5px rgba(217,169,78,0.85);
    opacity:0; animation: twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:0; transform: scale(0.4); }
    50%{ opacity:1; transform: scale(1.1); }
  }
  .lyric-line{ font-size: 21px; line-height:1.7; font-weight:600; letter-spacing:0.02em; font-family:'Songti SC',serif; position:relative; z-index:1; }
  .result-track{ font-size:11px; color: rgba(20,21,27,0.45); letter-spacing:0.04em; margin-top:22px; padding-top:16px; border-top:1px solid rgba(20,21,27,0.12); width:100%; }

  .result-actions{ margin-top:22px; display:flex; gap:10px; }
  .restart-btn, .share-btn{
    font-size:11.5px; border-radius:999px; padding:9px 18px; cursor:pointer;
    transition: color .2s ease, border-color .2s ease;
  }
  .restart-btn{ color: rgba(244,239,228,0.5); border:1px solid var(--line); }
  .restart-btn:hover{ color: var(--gold); border-color: var(--gold); }
  .share-btn{ color: var(--ink); background: var(--gold); border:1px solid var(--gold); }
  .share-note{ font-size:10px; color: rgba(244,239,228,0.3); margin-top:16px; text-align:center; line-height:1.6; max-width:280px; }
</style>
</head>
<body class="sans">

<div class="stage">

  <!-- ============ HOME ============ -->
  <div class="screen active" id="screen-home">
    <div class="eyebrow">乐迷答案之书 · demo</div>
    <div class="artist-name">星野 XINGYE</div>
    <div class="subtitle">选一个想问的方向</div>
    <div class="type-grid" id="typeGrid"></div>
    <div class="home-vinyl"></div>
  </div>

  <!-- ============ CATEGORY ============ -->
  <div class="screen" id="screen-category">
    <div class="back-btn" id="backFromCategory">←</div>
    <div class="cat-title" id="catTitle"></div>
    <div class="cat-sub" id="catSub"></div>
    <div class="section-label">快速提问</div>
    <div class="q-list" id="qList"></div>
    <div class="section-label">或者，自己写</div>
    <div class="custom-box">
      <textarea class="custom-input" id="customInput" placeholder="写下你想问TA的话……"></textarea>
      <button class="draw-btn" id="customDrawBtn">带着这句去翻开答案</button>
    </div>
  </div>

  <!-- ============ BOOK (swipe the cover to start) ============ -->
  <div class="screen" id="screen-book">
    <div class="back-btn" id="backFromBook">←</div>
    <div class="book-question" id="bookQuestion"></div>
    <div class="book-vinyl"></div>
    <div class="book-wrap" id="bookWrap">
      <div class="book-back"></div>
      <div class="book-cover" id="bookCover">
        <div class="closed-emblem">♪</div>
        <div class="closed-text">答案已经写好了</div>
      </div>
    </div>
    <div class="book-hint" id="bookHint"><span class="arrow">←</span> 滑动翻开 <span class="arrow">→</span></div>
  </div>

  <!-- ============ FLIP (big, obvious multi-page transition) ============ -->
  <div class="screen" id="screen-flip">
    <div class="flip-vinyl"></div>
    <div class="flip-stack" id="flipStack"></div>
    <div class="flip-caption">正在翻开答案之书…</div>
  </div>

  <!-- ============ RESULT (single revealed card) ============ -->
  <div class="screen" id="screen-result">
    <div class="back-btn" id="backFromResult">←</div>
    <div class="result-vinyl"></div>
    <div class="result-card" id="resultCard">
      <div class="result-mark"></div>
      <div class="result-question" id="resultQuestion"></div>
      <div class="lyric-wrap">
        <div class="stars" id="lyricStars"></div>
        <div class="lyric-line" id="lyricLine"></div>
      </div>
      <div class="result-track" id="resultTrack"></div>
    </div>
    <div class="result-actions">
      <div class="restart-btn" id="restartBtn">再问一次</div>
      <div class="share-btn" id="shareBtn">保存卡片</div>
    </div>
    <div class="share-note">正式版签文来自艺人歌词库，按语义标签匹配问题类型；此处文案为占位演示，非真实歌词。</div>
  </div>

</div>

<script>
/* ---------------- data ---------------- */
// Placeholder content for demo only — not a real artist or real lyrics.
const categories = [
  { id:'ta', label:'关于TA', desc:'今天TA想说的话', questions:[
      'TA今天在想什么', 'TA现在过得好吗', '这次巡演TA最想说的话'
    ]},
  { id:'me', label:'关于我', desc:'写给此刻的自己', questions:[
      '我现在该往哪走', '这件事我该放下吗', '我今天顺利吗'
    ]},
  { id:'us', label:'关于我们', desc:'作为乐迷的心事', questions:[
      '我这样支持TA值得吗', 'TA会记得我们吗', '这份喜欢该怎么继续'
    ]},
  { id:'future', label:'关于未来', desc:'留一点期待', questions:[
      '我们还会再见吗', '这条路值得走下去吗', '接下来会更好吗'
    ]}
];

const answers = [
  { line: '别把光留到最后一刻，\n你现在就在发着光。', track: '《未命名的夜》· demo track 01' },
  { line: '有些答案不必着急，\n风会替你记得方向。', track: '《慢一点》· demo track 02' },
  { line: '你问的问题，\n其实心里早有了回音。', track: '《回音》· demo track 03' },
  { line: '别怕这一段路走得孤单，\n你从来都被看见。', track: '《被看见》· demo track 04' },
  { line: '今天不需要答案，\n只需要一点点勇敢。', track: '《一点点》· demo track 05' },
  { line: '如果犹豫，\n就往你心跳更快的方向走。', track: '《心跳》· demo track 06' },
  { line: '你不是在等一个人，\n你是在等更好的自己。', track: '《等》· demo track 07' },
  { line: '那些没说出口的，\n时间会替你说完。', track: '《没说完》· demo track 08' }
];

/* ---------------- screen management ---------------- */
const screens = {
  home: document.getElementById('screen-home'),
  category: document.getElementById('screen-category'),
  book: document.getElementById('screen-book'),
  flip: document.getElementById('screen-flip'),
  result: document.getElementById('screen-result')
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
}

/* ---------------- home ---------------- */
const typeGrid = document.getElementById('typeGrid');
categories.forEach((cat, i)=>{
  const el = document.createElement('div');
  el.className = 'type-card';
  el.innerHTML = `
    <div class="type-num">0${i+1}</div>
    <div>
      <div class="type-label">${cat.label}</div>
      <div class="type-desc">${cat.desc}</div>
    </div>`;
  el.addEventListener('click', ()=> openCategory(cat));
  typeGrid.appendChild(el);
});

/* ---------------- category ---------------- */
const catTitle = document.getElementById('catTitle');
const catSub = document.getElementById('catSub');
const qList = document.getElementById('qList');
const customInput = document.getElementById('customInput');

function openCategory(cat){
  catTitle.textContent = cat.label;
  catSub.textContent = cat.desc;
  qList.innerHTML = '';
  customInput.value = '';
  cat.questions.forEach(q=>{
    const el = document.createElement('div');
    el.className = 'q-card';
    el.innerHTML = `<span>${q}</span><span class="go">翻开 →</span>`;
    el.addEventListener('click', ()=> goToBook(q));
    qList.appendChild(el);
  });
  showScreen('category');
}

document.getElementById('backFromCategory').addEventListener('click', ()=> showScreen('home'));
document.getElementById('customDrawBtn').addEventListener('click', ()=>{
  const val = customInput.value.trim();
  goToBook(val || '关于此刻的心情');
});
document.getElementById('backFromBook').addEventListener('click', ()=> showScreen('category'));
document.getElementById('backFromResult').addEventListener('click', ()=> showScreen('home'));

/* ---------------- book screen: swipe the cover to start ---------------- */
const bookQuestion = document.getElementById('bookQuestion');
const bookCover = document.getElementById('bookCover');
const bookHint = document.getElementById('bookHint');

let currentQuestion = '';
let revealed = false;

function goToBook(question){
  currentQuestion = question;
  bookQuestion.textContent = '你问 · ' + question;
  revealed = false;
  bookCover.style.transition = 'none';
  bookCover.style.transform = 'rotateY(0deg)';
  bookHint.style.opacity = 1;
  showScreen('book');
}

attachCoverSwipe(bookCover);

function attachCoverSwipe(el){
  let startX = 0, startY = 0, dx = 0, dragging = false, moved = false;

  function onDown(e){
    if(revealed) return;
    dragging = true; moved = false;
    startX = e.clientX; startY = e.clientY;
    el.style.transition = 'none';
    if(el.setPointerCapture && e.pointerId != null){
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    }
  }
  function onMove(e){
    if(!dragging || revealed) return;
    dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    if(Math.abs(dx) < Math.abs(dy)) return;
    let deg = (-dx / 240) * 180;
    deg = Math.max(-178, Math.min(178, deg));
    el.style.transform = `rotateY(${deg}deg)`;
    bookHint.style.opacity = Math.max(0, 1 - Math.abs(dx)/100);
  }
  function onUp(){
    if(!dragging || revealed) return;
    dragging = false;
    if(Math.abs(dx) > 70){
      openCover(dx > 0 ? -1 : 1);
    } else if(!moved){
      openCover(-1);
    } else {
      el.style.transition = 'transform .32s cubic-bezier(.2,.7,.3,1)';
      el.style.transform = 'rotateY(0deg)';
      bookHint.style.opacity = 1;
    }
    dx = 0;
  }

  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
}

function openCover(sign){
  revealed = true;
  bookCover.style.transition = 'transform .32s cubic-bezier(.25,.75,.35,1)';
  bookCover.style.transform = `rotateY(${sign * 178}deg)`;
  bookHint.style.opacity = 0;
  setTimeout(()=> startFlipStack(currentQuestion), 300);
}

/* ---------------- flip screen: big, obvious multi-page transition ---------------- */
const flipStack = document.getElementById('flipStack');

function buildFlipStack(){
  flipStack.innerHTML = '';
  for(let i=0;i<6;i++){
    const p = document.createElement('div');
    p.className = 'flip-page';
    p.style.zIndex = 6 - i;
    flipStack.appendChild(p);
  }
}

function startFlipStack(question){
  buildFlipStack();
  showScreen('flip');
  const pages = [...flipStack.children];
  let i = 0;
  const total = pages.length;
  const interval = setInterval(()=>{
    if(i < total){
      pages[i].style.transition = 'transform .16s ease-in';
      pages[i].style.transform = 'rotateY(-165deg)';
      i++;
    } else {
      clearInterval(interval);
      setTimeout(()=> enterResult(question), 220);
    }
  }, 120);
}

/* ---------------- result: single revealed card ---------------- */
const resultQuestion = document.getElementById('resultQuestion');
const lyricLine = document.getElementById('lyricLine');
const lyricStars = document.getElementById('lyricStars');
const resultTrack = document.getElementById('resultTrack');
const resultCard = document.getElementById('resultCard');

function buildStars(){
  lyricStars.innerHTML = '';
  const positions = [
    {top:'4%', left:'6%'}, {top:'14%', left:'88%'}, {top:'46%', left:'2%'},
    {top:'52%', left:'94%'}, {top:'86%', left:'12%'}, {top:'80%', left:'82%'},
    {top:'30%', left:'50%'}
  ];
  positions.forEach((pos, i)=>{
    const s = document.createElement('div');
    s.className = 'star';
    s.style.top = pos.top; s.style.left = pos.left;
    s.style.animationDelay = (i * 0.42).toFixed(2) + 's';
    s.style.animationDuration = (2.2 + (i % 3) * 0.5).toFixed(2) + 's';
    lyricStars.appendChild(s);
  });
}

function enterResult(question){
  const pick = answers[Math.floor(Math.random() * answers.length)];
  resultQuestion.innerHTML = `<span class="qlabel">你问</span>${question}`;
  lyricLine.innerHTML = pick.line.replace(/\n/g, '<br>');
  resultTrack.textContent = pick.track;
  buildStars();
  showScreen('result');
}

document.getElementById('restartBtn').addEventListener('click', ()=> showScreen('home'));
document.getElementById('shareBtn').addEventListener('click', ()=>{
  resultCard.style.transition = 'transform .15s ease';
  resultCard.style.transform = 'scale(0.98)';
  setTimeout(()=>{ resultCard.style.transform = ''; }, 150);
});
</script>
</body>
